{% extends 'base.html' %}

{% block title %}Create Account - Poohanas{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-container">
        <div class="auth-header">
            <h2>Create Account</h2>
            <p class="auth-subtitle">Join Poohanas for the best graphics cards</p>
        </div>

        <form method="post" class="auth-form">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <div class="form-row">
                <div class="form-group">
                    <label for="first_name" class="form-label">First Name</label>
                    <input type="text" id="first_name" name="first_name" class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="last_name" class="form-label">Last Name</label>
                    <input type="text" id="last_name" name="last_name" class="form-input" required>
                </div>
            </div>

            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-input" placeholder="Choose a username" required>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="your@email.com" required>
            </div>

            <div class="form-group">
                <label for="password1" class="form-label">Password</label>
                <input type="password" id="password1" name="password1" class="form-input" placeholder="Create a password" required>
            </div>

            <div class="form-group">
                <label for="password2" class="form-label">Confirm Password</label>
                <input type="password" id="password2" name="password2" class="form-input" placeholder="Confirm your password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Create Account</button>

            <div class="auth-actions">
                <p class="auth-link">
                    Already have an account? <a href="{% url 'login' %}">Sign in</a>
                </p>
            </div>
        </form>
    </div>
</div>

<style>
    .auth-page { min-height: calc(100vh - var(--header-height)); display: flex; align-items: center; justify-content: center; padding: 2rem 0; }
    .auth-container { width: 100%; max-width: 450px; background: #fff; border: 1px solid #e8e8ed; border-radius: 1rem; padding: 2.5rem; }
    .auth-header h2 { font-size: 1.75rem; font-weight: 600; margin-bottom: 0.5rem; text-align: center; }
    .auth-subtitle { color: #86868b; text-align: center; margin-bottom: 1.5rem; }
    .auth-form { display: flex; flex-direction: column; gap: 1rem; }
    .auth-actions { margin-top: 1.5rem; text-align: center; }
    .auth-link { font-size: 0.875rem; color: #86868b; }
    .auth-link a { color: #1d1d1f; font-weight: 500; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
</style>
{% endblock %}
