{% extends 'base.html' %}

{% block title %}Password Changed - Poohanas{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-container">
        <h2>Password Changed</h2>
        <p>Your password has been successfully changed.</p>
        <a href="{% url 'store:account_dashboard' %}" class="btn btn-primary">Back to Account</a>
    </div>
</div>

<style>
    .auth-page { min-height: 60vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .auth-container { width: 100%; max-width: 400px; background: #fff; border: 1px solid #e8e8ed; border-radius: 1rem; padding: 2rem; text-align: center; }
</style>
{% endblock %}
