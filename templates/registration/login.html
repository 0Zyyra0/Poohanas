{% extends 'base.html' %}

{% block title %}Login - Poohanas{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-container">
        <div class="auth-header">
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Sign in to your account</p>
        </div>

        {% if form.errors %}
        <div class="alert alert-error">
            <p>Invalid username or password</p>
        </div>
        {% endif %}

        <form method="post" class="auth-form">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <div class="form-group">
                <label for="username" class="form-label">Username or Email</label>
                <input type="text" id="username" name="username" class="form-input" placeholder="Enter your username" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Sign In</button>

            <div class="auth-actions">
                <p class="auth-link">
                    Don't have an account? <a href="{% url 'register' %}">Create one</a>
                </p>
                <p class="auth-link">
                    <a href="#">Forgot your password?</a>
                </p>
            </div>
        </form>
    </div>
</div>

<style>
    .auth-page { min-height: calc(100vh - var(--header-height)); display: flex; align-items: center; justify-content: center; padding: 2rem 0; }
    .auth-container { width: 100%; max-width: 400px; background: #fff; border: 1px solid #e8e8ed; border-radius: 1rem; padding: 2.5rem; }
    .auth-header h2 { font-size: 1.75rem; font-weight: 600; margin-bottom: 0.5rem; text-align: center; }
    .auth-subtitle { color: #86868b; text-align: center; }
    .auth-form { display: flex; flex-direction: column; gap: 1rem; }
    .auth-actions { margin-top: 1.5rem; text-align: center; }
    .auth-link { font-size: 0.875rem; color: #86868b; }
    .auth-link a { color: #1d1d1f; font-weight: 500; }
</style>
{% endblock %}
