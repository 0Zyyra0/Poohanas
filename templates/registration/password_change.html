{% extends 'base.html' %}

{% block title %}Change Password - Poohanas{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-container">
        <h2>Change Password</h2>
        <form method="post" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Change Password</button>
        </form>
    </div>
</div>

<style>
    .auth-page { min-height: 60vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .auth-container { width: 100%; max-width: 400px; background: #fff; border: 1px solid #e8e8ed; border-radius: 1rem; padding: 2rem; }
    .auth-form { display: flex; flex-direction: column; gap: 1rem; }
</style>
{% endblock %}
